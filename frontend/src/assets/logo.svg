<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Quatrefoil mandala: four circles (the four dichotomies / function positions)
       that all pass through one centre point (Jung's Self), inside an outer orbit. -->
  <circle class="logo-orbit" cx="32" cy="32" r="29" stroke="#818cf8" stroke-opacity="0.45" stroke-width="1.5"/>
  <g class="logo-petals" stroke="#818cf8" stroke-width="2.25">
    <circle cx="32" cy="20.5" r="11.5"/>
    <circle cx="43.5" cy="32" r="11.5"/>
    <circle cx="32" cy="43.5" r="11.5"/>
    <circle cx="20.5" cy="32" r="11.5"/>
  </g>
  <circle class="logo-core" cx="32" cy="32" r="3.5" fill="#2dd4bf"/>
</svg>
